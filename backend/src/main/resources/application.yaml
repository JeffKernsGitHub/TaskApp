spring:
  application:
    name: taskmanager
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db?currentSchema=tasks
    username: spring_boot_user
    password: ServerAppSecret123!
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    open-in-view: false # Closes DB connection after @Service completes; prevents N+1 in web layer
    generate-ddl: false # Prevents JPA provider from issuing DDL
    hibernate:
      ddl-auto: validate # Read-only schema verification at boot; fails fast on mismatch
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25 # High performance JDBC batching
    show-sql: true

application:
  security:
    jwt:
      # 256-bit secret key for HMAC-SHA256
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # 15 minutes access token lifetime (NIST SP 800-63B inactivity guideline: 900,000 ms)
      expiration-ms: 900000

server:
  port: 8080
